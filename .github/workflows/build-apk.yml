
name: Build VIRAL FACTORY APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'viral-factory-android-project.zip'
      - 'viral-factory-android/app/build.gradle'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Save corrected Gradle file
        run: |
          mkdir -p /tmp/build-fix
          cp viral-factory-android/app/build.gradle /tmp/build-fix/build.gradle

      - name: Extract Android project
        run: unzip -oq viral-factory-android-project.zip

      - name: Apply JVM target fix
        run: |
          cp /tmp/build-fix/build.gradle viral-factory-android/app/build.gradle

      - name: Package extracted source
        run: |
          zip -qr viral-factory-android-source.zip viral-factory-android \
            -x '*/build/*' '*/.gradle/*'

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: viral-factory-android-source
          path: viral-factory-android-source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: viral-factory-android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: viral-factory-debug-apk
          path: viral-factory-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
